name: lightrat CI

on:
  push:
    branches: [main]
    paths:
      - "lightrat/**"
      - "test/**"
  pull_request:
    branches: [main]
    paths:
      - "lightrat/**"
      - "test/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Cache Bazel
        uses: ./.github/actions/bazel-cache

      - name: Build
        run: bazel run //lightrat:lightrat_bin

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: ./.github/actions/bazel-cache

      - name: Lint
        run: bazel test //lightrat/...

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bazel-cache

      - name: Test
        run: bazel test //tests/...

  sanitize:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bazel-cache

      - name: Sanitize threaded test
        run: bazel test --config=tsan //tests:test_multithreaded

      - name: Sanitize memory test
        run: bazel test --config=msan //tests/...

  dwyu:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bazel-cache

      - name: Test
        run: bazel build --config=dwyu //lightrat
