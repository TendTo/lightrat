name: lightrat (python) CI

on:
  push:
    branches: [main]
    paths:
      - "lightrat/**"
      - "bindings/python/**"
      - "test/**"
  pull_request:
    branches: [main]
    paths:
      - "lightrat/**"
      - "bindings/python/**"
      - "test/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Cache Bazel
        uses: ./.github/actions/bazel-cache

      - name: Run tests
        shell: bash
        run: |
          mkdir -p dist
          for py_version in 3.10 3.11 3.12 3.13 3.14 3.15; do
            bazel test --config=py --python_version=$py_version //bindings/python/lightrat/tests/...
          done

  build:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-22.04]
        py: ["3.10"]

    steps:
      - uses: actions/checkout@v7

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py }}
          cache: "pip"

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools>=84.2.1" "build>=1.6.1" "auditwheel>=6.8.2"

      - name: Cache Bazel
        uses: ./.github/actions/bazel-cache

      - name: Install the latest patchelf binary
        if: matrix.os == 'ubuntu-22.04'
        uses: jaxxstorm/action-install-gh-release@v4.0.0
        with:
          repo: NixOS/patchelf
          binaries-location: bin
          digest: 38861b171079e440b25ac86483284f690d0ee7921dba98b0c8fe04a9b0a11667
          platform-matching: disable
          chmod: 0755
          arch: x86_64
          cache: enable
          tag: "0.19.3"

      - name: Build source distribution
        run: |
          python3 -m build

      - name: Ensure wheels support manylinux (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          auditwheel repair dist/lightrat-*.whl -w dist
          rm dist/*-linux*.whl

      - name: Upload dists
        uses: actions/upload-artifact@v7
        with:
          name: release-dists-${{ matrix.os }}-${{ matrix.py }}
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/

      - name: Publish release distributions to PyPI (Test)
        if: github.ref_type != 'tag'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
          verbose: true
          repository-url: https://test.pypi.org/legacy/

      - name: Publish release distributions to PyPI (Production)
        if: github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
          verbose: true
